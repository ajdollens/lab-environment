---
- name: Install alloy agent
  hosts: all
  become: true
  vars:
    # Alloy's apt versions carry a "-1" package revision suffix
    alloy_version: "1.20.1-1"

  tasks:
    - name: Add grafana repo
      ansible.builtin.deb822_repository:
        name: grafana_repo
        types: deb
        uris: https://apt.grafana.com
        suites: stable
        components: main
        signed_by: https://apt.grafana.com/gpg-full.key

    - name: Install alloy agent
      ansible.builtin.apt:
        name: "alloy={{ alloy_version }}"
        state: present
        update_cache: true

    # Config (alloy.j2) and listen address are applied at runtime, which then
    # enables and starts the service. Until then it must not run on boot.
    - name: Keep alloy disabled in the image
      ansible.builtin.systemd_service:
        name: alloy
        enabled: false
