- name: Install node_exporter/alloy agent 
  hosts: all 
  become: true
  vars: 
    node_exporter_version: "1.12.1"
    node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    node_exporter_release: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
    node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
    node_exporter_bin: /usr/local/bin/node_exporter
    node_exporter_user: node-exporter
    node_exporter_group: "{{ node_exporter_user }}"
  
  tasks: 
    - name: Create node exporter system user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Download node exporter
      ansible.builtin.get_url:
        url: "{{ node_exporter_url }}/{{ node_exporter_release }}.tar.gz"
        dest: "/tmp/{{ node_exporter_release }}.tar.gz"
        checksum: "sha256:{{ node_exporter_url }}/sha256sums.txt"
        mode: "0644"

    - name: Unpack node exporter
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_release }}.tar.gz"
        dest: /tmp/
        remote_src: true

    - name: Install node exporter binary
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_release }}/node_exporter"
        dest: "{{ node_exporter_bin }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Install node exporter service
      ansible.builtin.template:
        src: node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"

    # Enable only: it starts on first boot of VMs built from this image
    - name: Enable node exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        enabled: true
        daemon_reload: true
